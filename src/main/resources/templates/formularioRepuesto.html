<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Repuesto</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<style>
		body {
			background: #eef2f7;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.form-control:focus,
		.form-select:focus {
			border-color: #198754;
			box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.25);
		}
	</style>
</head>

<body>

	<div class="container mt-5" style="max-width: 650px;">

		<div class="card shadow-lg">

			<div class="card-header bg-success text-white">
				<h4 class="mb-0"
					th:text="${repuesto.idrepuesto == null or repuesto.idrepuesto == 0} ? '➕ Nuevo Repuesto' : '✏️ Editar Repuesto'">
				</h4>
			</div>

			<div class="card-body">

				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<form th:action="@{/guardarRepuestos}" th:object="${repuesto}" method="post">

					<input type="hidden" th:field="*{idrepuesto}">

					<div class="mb-3">
						<label class="form-label fw-semibold">Nombre</label>
						<input type="text" th:field="*{nombre}" class="form-control"
							placeholder="Ej. Pantalla LED 15.6&quot;" required>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Marca</label>
						<input type="text" th:field="*{marca}" class="form-control" placeholder="Ej. Samsung" required>
					</div>

					<div class="row">
						<div class="col-md-4 mb-3">
							<label class="form-label fw-semibold">Stock</label>
							<input type="number" th:field="*{stock}" class="form-control" min="0" step="1" required>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label fw-semibold">Precio compra (S/)</label>
							<input type="number" th:field="*{precioCompra}" class="form-control" min="0" step="0.01"
								required>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label fw-semibold">Precio venta (S/)</label>
							<input type="number" th:field="*{precioVenta}" class="form-control" min="0" step="0.01"
								required>
						</div>
					</div>

					<div class="mb-4">
						<label class="form-label fw-semibold">Proveedor</label>
						<select th:field="*{proveedor.idproveedor}" class="form-select" required>
							<option value="">Seleccione un proveedor</option>
							<option th:each="p : ${proveedores}" th:value="${p.idproveedor}" th:text="${p.razonsocial}">
							</option>
						</select>
					</div>

					<div class="d-flex gap-2">
						<button type="submit" class="btn btn-success">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar
						</button>
						<a th:href="@{/listarRepuestos}" class="btn btn-secondary">
							<i class="fa-solid fa-arrow-left me-1"></i> Regresar
						</a>
					</div>

				</form>
			</div>

			<div class="card-footer text-center text-muted">
				Sistema de Servicio Técnico © 2026
			</div>

		</div>
	</div>

</body>

</html>
