<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TechSolutions – Iniciar Sesión</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<style th:inline="css">
		body {
			background: url('[[@{/imagenes/fondo-login.jpg}]]') no-repeat center center fixed;
			background-size: cover;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.login-card {
			background: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(5px);
			border-radius: 20px;
			padding: 40px;
			width: 380px;
			max-width: 92vw;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
		}

		.logo-area {
			text-align: center;
			margin-bottom: 30px;
		}

		.logo-area i {
			font-size: 55px;
			color: #0d6efd;
		}

		.logo-area h2 {
			font-weight: 700;
			margin-top: 10px;
		}

		.logo-area p {
			color: #64748b;
			font-size: 14px;
		}

		.form-label {
			font-weight: 600;
		}

		.form-control {
			border-radius: 10px;
			padding: 12px;
		}

		.btn-login {
			background: linear-gradient(135deg, #0d6efd, #4f8cff);
			border: none;
			border-radius: 10px;
			padding: 12px;
			font-weight: 600;
			width: 100%;
		}

		.input-group-text {
			cursor: pointer;
		}
	</style>
</head>

<body>

	<div class="login-card">

		<div class="logo-area">
			<i class="fa-solid fa-laptop-code"></i>
			<h2>TechSolutions</h2>
			<p>Sistema de Gestión de Servicio Técnico</p>
		</div>

		<div th:if="${param.error != null and param.error[0] != 'role'}"
			class="alert alert-danger d-flex align-items-center gap-2">
			<i class="fa-solid fa-circle-exclamation"></i>
			<span>Correo o contraseña incorrectos.</span>
		</div>

		<div th:if="${param.error != null and param.error[0] == 'role'}"
			class="alert alert-warning d-flex align-items-center gap-2">
			<i class="fa-solid fa-user-lock"></i>
			<span>Tu usuario no tiene un rol válido. Contacta al administrador.</span>
		</div>

		<div th:if="${param.logout != null}" class="alert alert-success d-flex align-items-center gap-2">
			<i class="fa-solid fa-check-circle"></i>
			<span>Sesión cerrada correctamente.</span>
		</div>

		<form th:action="@{/login}" method="post">

			<div class="mb-3">
				<label class="form-label">
					<i class="fa fa-envelope text-primary"></i> Correo electrónico
				</label>
				<input type="email" name="correo" class="form-control" placeholder="ejemplo@correo.com" required
					autofocus>
			</div>

			<div class="mb-3">
				<label class="form-label">
					<i class="fa fa-lock text-primary"></i> Contraseña
				</label>

				<div class="input-group">
					<input type="password" name="password" id="passwordInput" class="form-control"
						placeholder="contraseña" required>

					<span class="input-group-text" onclick="togglePassword()">
						<i class="fa fa-eye" id="eyeIcon"></i>
					</span>
				</div>
			</div>

			<button type="submit" class="btn btn-login btn-primary">
				<i class="fa fa-right-to-bracket me-2"></i> Iniciar Sesión
			</button>

		</form>

		<div class="text-center mt-4 text-muted" style="font-size: 12px;">
			<i class="fa fa-shield-halved me-1"></i>
			Acceso protegido · TechSolutions © 2026
		</div>

	</div>

	<script>
		function togglePassword() {
			const input = document.getElementById("passwordInput");
			const icon = document.getElementById("eyeIcon");

			if (input.type === "password") {
				input.type = "text";
				icon.classList.replace("fa-eye", "fa-eye-slash");
			} else {
				input.type = "password";
				icon.classList.replace("fa-eye-slash", "fa-eye");
			}
		}
	</script>

</body>

</html>
