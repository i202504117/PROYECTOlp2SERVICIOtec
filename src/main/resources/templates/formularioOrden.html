<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Orden de Servicio</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<style>
		body {
			background: #eef2f7;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.form-control:focus,
		.form-select:focus {
			border-color: #198754;
			box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.25);
		}
	</style>
</head>

<body>

	<div class="container mt-5 mb-5" style="max-width: 700px;">

		<div class="card shadow-lg">

			<div class="card-header bg-success text-white">
				<h4 class="mb-0"
					th:text="${orden.idorden == null or orden.idorden == 0} ? '➕ Nueva Orden de Servicio' : '✏️ Editar Orden de Servicio'">
				</h4>
			</div>

			<div class="card-body">

				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<form th:action="@{/guardarOrden}" th:object="${orden}" method="post">

					<input type="hidden" th:field="*{idorden}">

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label fw-semibold">Cliente</label>
							<select th:field="*{cliente.idCliente}" class="form-select" required>
								<option value="">-- Seleccionar cliente --</option>
								<option th:each="c : ${clientes}" th:value="${c.idCliente}"
									th:text="${c.nombre + ' ' + c.apellido}">
								</option>
							</select>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label fw-semibold">Técnico</label>
							<select th:field="*{tecnico.idtecnico}" class="form-select" required>
								<option value="">-- Seleccionar técnico --</option>
								<option th:each="t : ${tecnicos}" th:value="${t.idtecnico}" th:text="${t.nombre}">
								</option>
							</select>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Equipo</label>
						<input type="text" th:field="*{equipo}" class="form-control"
							placeholder="Ej. Laptop HP Pavilion 15" required>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Problema</label>
						<textarea th:field="*{problema}" class="form-control" rows="3"
							placeholder="Describe la falla reportada" required></textarea>
					</div>

					<div class="row">
						<div class="col-md-4 mb-3">
							<label class="form-label fw-semibold">Fecha</label>
							<input type="date" th:field="*{fecha}" class="form-control" required>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label fw-semibold">Estado</label>
							<select th:field="*{estado}" class="form-select" required>
								<option value="Recepcionado">Recepcionado</option>
								<option value="En Reparación">En Reparación</option>
								<option value="Listo para Entrega">Listo para Entrega</option>
								<option value="Entregado">Entregado</option>
							</select>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label fw-semibold">Costo (S/)</label>
							<input type="number" step="0.01" min="0" th:field="*{costo}" class="form-control" required>
						</div>
					</div>

					<div class="d-flex gap-2 mt-3">
						<button type="submit" class="btn btn-success">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar Orden
						</button>
						<a th:href="@{/listarOrdenes}" class="btn btn-secondary">
							<i class="fa-solid fa-arrow-left me-1"></i> Regresar
						</a>
					</div>

				</form>
			</div>

			<div class="card-footer text-center text-muted">
				Sistema de Servicio Técnico © 2026
			</div>

		</div>
	</div>

</body>

</html>
