<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Proveedor</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<style>
		body {
			background: #eef2f7;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.form-control:focus {
			border-color: #198754;
			box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.25);
		}
	</style>
</head>

<body>

	<div class="container mt-5" style="max-width: 600px;">

		<div class="card shadow-lg">

			<div class="card-header bg-success text-white">
				<h4 class="mb-0"
					th:text="${proveedor.idproveedor == null or proveedor.idproveedor == 0} ? '➕ Nuevo Proveedor' : '✏️ Editar Proveedor'">
				</h4>
			</div>

			<div class="card-body">

				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<form th:action="@{/guardarProveedor}" th:object="${proveedor}" method="post">

					<input type="hidden" th:field="*{idproveedor}">

					<div class="mb-3">
						<label class="form-label fw-semibold">Razón Social</label>
						<input type="text" th:field="*{razonsocial}" class="form-control"
							placeholder="Ej. Distribuidora Tech S.A.C." required>
					</div>

					<div class="mb-4">
						<label class="form-label fw-semibold">Teléfono</label>
						<input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej. 044123456"
							required>
					</div>

					<div class="d-flex gap-2">
						<button type="submit" class="btn btn-success">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar
						</button>
						<a th:href="@{/listarProveedores}" class="btn btn-secondary">
							<i class="fa-solid fa-arrow-left me-1"></i> Regresar
						</a>
					</div>

				</form>
			</div>

			<div class="card-footer text-center text-muted">
				Sistema de Gestión de Proveedores © 2026
			</div>

		</div>
	</div>

</body>

</html>
