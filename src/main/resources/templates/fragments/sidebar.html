<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="sidebar">

    <div class="sidebar">
        <div>
            <div class="logo">
                <i class="fa-solid fa-laptop-code"></i>
                <h3>TechSolutions</h3>
                <span class="badge-rol">
                    <i class="fa fa-crown me-1"></i>Administrador
                </span>
            </div>

            <hr class="text-secondary mx-3">

            <nav>
                <a href="/index" class="nav-link active">
                    <i class="fa fa-home"></i> Dashboard
                </a>

                <a href="/listarClientes" class="nav-link">
                    <i class="fa fa-users"></i> Clientes
                </a>
				
				<a th:href="@{/listarUsuarios}" class="nav-link">
				    <i class="fa fa-user"></i> Usuarios
				</a>
				

                <a href="/listarRepuestos" class="nav-link">
                    <i class="fa fa-box"></i> Respuestos
                </a>

                <a href="/listarProveedores" class="nav-link">
                    <i class="fa fa-truck"></i> Proveedores
                </a>

                <a href="/listarTecnicos" class="nav-link">
                    <i class="fa fa-screwdriver-wrench"></i> Técnicos
                </a>

                <a href="/listarOrdenes" class="nav-link">
                    <i class="fa fa-clipboard-list"></i> Órdenes
                </a>

                <a href="/reportes" class="nav-link">
                    <i class="fa fa-chart-bar"></i> Reportes
                </a>
            </nav>
        </div>

        <div class="logout-section">
            <div class="text-secondary small mb-2 ps-1">
                <i class="fa fa-user-circle me-1"></i>
                <span th:text="${nombreUsuario}">
                    admin@techsolutions.com
                </span>
            </div>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout">
                    <i class="fa fa-right-from-bracket"></i>
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
