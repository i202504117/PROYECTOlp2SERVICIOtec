<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Gestión de Clientes</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<link rel="stylesheet" th:href="@{/css/admin.css}" sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')">

	<link rel="stylesheet" th:href="@{/css/sidebar-tecnico.css}" sec:authorize="hasAuthority('ROLE_TECNICO')">

	<style>
		body {
			background: #eef2f7;
		}

		.header {
			background: linear-gradient(135deg, #0d6efd, #0a58ca);
			color: white;
			padding: 25px;
			border-radius: 15px;
			margin-bottom: 20px;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.table th {
			text-align: center;
		}

		.table td {
			vertical-align: middle;
		}

		.btn {
			border-radius: 10px;
		}
	</style>

</head>

<body>

	<div sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')">
		<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	</div>

	<div sec:authorize="hasAuthority('ROLE_TECNICO')">
		<div th:replace="~{fragments/sidebar-tecnico :: sidebar}"></div>
	</div>

	<div class="container">

		<div class="header shadow">
			<h2>👥 Gestión de Clientes</h2>
			<p class="mb-0">
				Sistema de Servicio Técnico de Laptops
			</p>
		</div>

		<div class="card shadow">

			<div class="card-body">

				<div class="d-flex justify-content-between mb-4">

					<div>

						<a sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')" th:href="@{/nuevoCliente}"
							class="btn btn-success">
							➕ Nuevo Cliente
						</a>

						<a th:href="@{/listarClientes}" class="btn btn-dark">
							🔄 Actualizar
						</a>

					</div>

				</div>

				<form th:action="@{/buscarCliente}" method="get">

					<div class="row mb-4">

						<div class="col-md-6">

							<input type="text" name="dni" class="form-control" placeholder="🔍 Buscar cliente por DNI"
								required>

						</div>

						<div class="col-md-2">

							<button type="submit" class="btn btn-primary w-100">
								Buscar
							</button>

						</div>

					</div>

				</form>

				<table class="table table-hover table-striped table-bordered">
					<thead>
						<tr>
							<th>ID</th>
							<th>DNI</th>
							<th>Nombre</th>
							<th>Apellido</th>
							<th>Teléfono</th>
							<th>Dirección</th>
							<th sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')">Acciones</th>
						</tr>
					</thead>
					<tbody>

						<tr th:if="${#lists.isEmpty(clientes)}">
							<td colspan="7" class="text-center text-danger">
								No se encontraron clientes
							</td>
						</tr>

						<tr th:each="c : ${clientes}">
							<td th:text="${c.idCliente}"></td>
							<td th:text="${c.dni}"></td>
							<td th:text="${c.nombre}"></td>
							<td th:text="${c.apellido}"></td>
							<td th:text="${c.telefono}"></td>
							<td th:text="${c.direccion}"></td>

							<td class="text-center" sec:authorize="hasAuthority('ROLE_ADMINISTRADOR')">
								<a th:href="@{/editarCliente/{id}(id=${c.idCliente})}"
									class="btn btn-warning btn-sm">✏️</a>
								<a th:href="@{/eliminarCliente/{id}(id=${c.idCliente})}" class="btn btn-danger btn-sm"
									onclick="return confirm('¿Desea eliminar este cliente?')">🗑️</a>
							</td>
						</tr>
					</tbody>
				</table>

				<a th:href="@{/reporte/clientes/pdf}" target="_blank" class="btn btn-danger">
					<i class="fa-solid fa-file-pdf"></i>
					Exportar PDF
				</a>

				<div class="text-center mt-3 text-muted">
					Total de clientes:
					<strong th:text="${#lists.size(clientes)}"></strong>
				</div>

			</div>

		</div>

	</div>

</body>

</html>
