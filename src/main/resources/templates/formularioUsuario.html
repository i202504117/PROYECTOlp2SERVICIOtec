<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nuevo Usuario</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<style>
		body {
			background: #eef2f7;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.form-control:focus,
		.form-select:focus {
			border-color: #0d6efd;
			box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
		}
	</style>
</head>

<body>

	<div class="container mt-5" style="max-width: 600px;">

		<div class="card shadow-lg">

			<div class="card-header bg-primary text-white">
				<h4 class="mb-0"><i class="fa-solid fa-user-shield me-2"></i>Nuevo Usuario</h4>
			</div>

			<div class="card-body">

				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<form th:action="@{/guardarUsuario}" th:object="${usuario}" method="post" autocomplete="off">

					<div class="mb-3">
						<label class="form-label fw-semibold">Nombre</label>
						<input type="text" th:field="*{name}" class="form-control" autocomplete="off" required>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Correo</label>
						<input type="email" th:field="*{email}" class="form-control" autocomplete="off" required>
					</div>

					<div class="mb-3">
						<label class="form-label fw-semibold">Contraseña</label>
						<input type="password" th:field="*{password}" class="form-control" autocomplete="new-password"
							required>
					</div>

					<div class="mb-4">
						<label class="form-label fw-semibold">Rol</label>
						<select th:field="*{rol.idRol}" class="form-select" required>
							<option value="">Seleccione</option>
							<option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}">
							</option>
						</select>
					</div>

					<div class="d-flex gap-2">
						<button type="submit" class="btn btn-primary">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar
						</button>
						<a th:href="@{/listarUsuarios}" class="btn btn-secondary">
							<i class="fa-solid fa-arrow-left me-1"></i> Cancelar
						</a>
					</div>

				</form>
			</div>

			<div class="card-footer text-center text-muted">
				Sistema de Servicio Técnico © 2026
			</div>

		</div>
	</div>

</body>

</html>
