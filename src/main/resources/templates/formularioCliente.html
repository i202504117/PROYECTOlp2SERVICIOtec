<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>TechSolutions - Registro de Cliente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-light">

	<div class="container mt-5" style="max-width: 600px;">
		<div class="card shadow p-4">
			
			<h2 class="mb-4 text-primary"><i class="fa-solid fa-user-plus me-2"></i>Registro de Cliente</h2>
			
			<!-- Alerta de error de negocio (ej. DNI duplicado) -->
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

			<form th:action="@{/guardarCliente}" th:object="${cliente}" method="post">

				<!-- ID oculto para saber si es un registro nuevo o una edición -->
				<input type="hidden" th:field="*{idCliente}">

				<div class="mb-3">
					<label class="form-label fw-bold">DNI</label>
					<input type="text" th:field="*{dni}" class="form-control" maxlength="8" placeholder="Ingrese 8 dígitos" required>
				</div>

				<div class="mb-3">
					<label class="form-label fw-bold">Nombre</label>
					<input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingrese el nombre" required>
				</div>

				<!-- CAMPO AGREGADO: Obligatorio por la entidad -->
				<div class="mb-3">
					<label class="form-label fw-bold">Apellido</label>
					<input type="text" th:field="*{apellido}" class="form-control" placeholder="Ingrese el apellido" required>
				</div>

				<div class="mb-3">
					<label class="form-label fw-bold">Teléfono</label>
					<input type="text" th:field="*{telefono}" class="form-control" placeholder="Ingrese el teléfono o celular">
				</div>

				<div class="mb-3">
					<label class="form-label fw-bold">Dirección</label>
					<input type="text" th:field="*{direccion}" class="form-control" placeholder="Ingrese la dirección">
				</div>

				<div class="d-flex justify-content-between mt-4">
					<button type="submit" class="btn btn-success">
						<i class="fa-solid fa-save me-1"></i> Guardar
					</button>
					<a th:href="@{/listarClientes}" class="btn btn-secondary">
						<i class="fa-solid fa-arrow-left me-1"></i> Regresar
					</a>
				</div>

			</form>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
