<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>Gestión de Técnicos</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/admin.css}">

	<style>
		body {
			background: #f4f6f9;
		}

		.titulo {
			color: #0d6efd;
			font-weight: bold;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.table {
			vertical-align: middle;
		}
	</style>

</head>

<body>
	<div sec:authorize="hasRole('ADMINISTRADOR')">
		       <div th:replace="~{fragments/sidebar :: sidebar}"></div>
		   </div>

		   <!-- TECNICO -->
		   <div sec:authorize="hasRole('TECNICO')">
		       <div th:replace="~{fragments/sidebar-tecnico :: sidebar}"></div>
		   </div>
		

	<div class="container ">

		<!-- TÍTULO -->
		<div class="text-center mb-4">

			<h1 class="titulo">
				🔧 Gestión de Técnicos
			</h1>

			<p class="text-muted">
				Administración de técnicos del sistema
			</p>

		</div>

		<div class="card shadow-lg">

			<!-- ENCABEZADO -->
			<div class="card-header bg-primary text-white d-flex justify-content-between">

				<h4 class="mb-0">
					📋 Listado de Técnicos
				</h4>

				<span class="badge bg-light text-dark">
					Total:
					<span th:text="${#lists.size(tecnicos)}"></span>
				</span>

			</div>

			<div class="card-body">

				<!-- BOTONES -->
				<div class="mb-4">

					<a th:href="@{/nuevoTecnico}" class="btn btn-primary">
						➕ Nuevo Técnico
					</a>

					<a sec:authorize="hasRole('ROLE_ADMINISTRADOR')" th:href="@{/index}" class="btn btn-secondary">
						Regresar
					</a>

					<a sec:authorize="hasRole('ROLE_TECNICO')" th:href="@{/dashboard-tecnico}"
						class="btn btn-secondary">
						Regresar
					</a>

				</div>

				<!-- BUSCADOR -->
				<form th:action="@{/buscarTecnico}" method="get">

					<div class="row mb-4">

						<div class="col-md-5">

							<input type="text" name="nombre" class="form-control"
								placeholder="🔎 Buscar técnico por nombre">

						</div>

						<div class="col-auto">

							<button type="submit" class="btn btn-primary">
								Buscar
							</button>

						</div>

						<div class="col-auto">

							<a th:href="@{/listarTecnicos}" class="btn btn-dark">
								Mostrar Todos
							</a>

						</div>

					</div>

				</form>

				<!-- TABLA -->
				<table class="table table-striped table-hover table-bordered">

					<thead class="table-dark">

						<tr>
							<th>ID</th>
							<th>Nombre</th>
							<th>Especialidad</th>
							<th>Teléfono</th>
							<th >Acciones</th>
						</tr>

					</thead>

					<tbody>

						<tr th:each="t : ${tecnicos}">

							<td th:text="${t.idtecnico}"></td>

							<td th:text="${t.nombre}"></td>

							<td th:text="${t.especialidad}"></td>

							<td th:text="${t.telefono}"></td>

							<td>

								<a th:href="@{/editarTecnico/{id}(id=${t.idtecnico})}" class="btn btn-warning btn-sm">
									✏️ Editar
								</a>

								<a th:href="@{/eliminarTecnico/{id}(id=${t.idtecnico})}" class="btn btn-danger btn-sm"
									onclick="return confirm('¿Desea eliminar este técnico?')">
									🗑 Eliminar
								</a>

							</td>

						</tr>

					</tbody>

				</table>

			</div>

			<div class="card-footer text-center text-muted">

				Sistema de Gestión de Técnicos © 2026

			</div>

		</div>

	</div>

</body>

</html>
