<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Gestión de Proveedores</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

	<link rel="stylesheet" th:href="@{/css/admin.css}">
	<style>
		body {
			background: #f4f6f9;
		}

		.titulo {
			color: #198754;
			font-weight: bold;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.table {
			vertical-align: middle;
		}
	</style>

</head>

<body>
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>
	
	<div class="container ">

		<!-- TÍTULO -->
		<div class="text-center mb-4">

			<h1 class="titulo">
				📦 Gestión de Proveedores
			</h1>

			<p class="text-muted">
				Administración de proveedores del sistema
			</p>

		</div>

		<div class="card shadow-lg">

			<!-- ENCABEZADO -->
			<div class="card-header bg-success text-white d-flex justify-content-between">

				<h4 class="mb-0">
					📋 Listado de Proveedores
				</h4>

				<span class="badge bg-light text-dark">
					Total:
					<span th:text="${#lists.size(proveedores)}"></span>
				</span>

			</div>

			<div class="card-body">

				<!-- BOTONES -->
				<div class="mb-4">

					<a th:href="@{/nuevoProveedor}" class="btn btn-success">
						➕ Nuevo Proveedor
					</a>

					<a th:href="@{/index}" class="btn btn-secondary">
						Regresar
					</a>
				</div>

				<!-- BUSCADOR -->
				<form th:action="@{/buscarProveedor}" method="get">

					<div class="row mb-4">

						<div class="col-md-5">

							<input type="text" name="nombre" class="form-control"
								placeholder="🔎 Buscar proveedor por razón social">

						</div>

						<div class="col-auto">

							<button type="submit" class="btn btn-primary">
								Buscar
							</button>

						</div>

						<div class="col-auto">

							<a th:href="@{/listarProveedores}" class="btn btn-dark">
								Mostrar Todos
							</a>

						</div>

					</div>

				</form>

				<!-- TABLA -->
				<table class="table table-striped table-hover table-bordered">

					<thead class="table-dark">

						<tr>
							<th>ID</th>
							<th>Razón Social</th>
							<th>Teléfono</th>
							<th width="180">Acciones</th>
						</tr>

					</thead>

					<tbody>

						<tr th:each="p : ${proveedores}">

							<td th:text="${p.idproveedor}"></td>

							<td th:text="${p.razonsocial}"></td>

							<td th:text="${p.telefono}"></td>

							<td>

								<a th:href="@{/editarProveedor/{id}(id=${p.idproveedor})}"
									class="btn btn-warning btn-sm">
									✏️ Editar
								</a>

								<a th:href="@{/eliminarProveedor/{id}(id=${p.idproveedor})}"
									class="btn btn-danger btn-sm"
									onclick="return confirm('¿Desea eliminar este proveedor?')">
									🗑 Eliminar
								</a>

							</td>

						</tr>

					</tbody>

				</table>

			</div>

			<div class="card-footer text-center text-muted">

				Sistema de Gestión de Proveedores © 2026

			</div>

		</div>

	</div>

</body>

</html>
