<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario de Técnico</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: #f4f6f9;
		}

		.titulo {
			color: #0d6efd;
			font-weight: bold;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.form-control:focus {
			border-color: #0d6efd;
			box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
		}
	</style>

</head>

<body>

	<div class="container mt-5" style="max-width: 650px;">

		<div class="text-center mb-4">

			<h1 class="titulo">
				🔧 Gestión de Técnicos
			</h1>

			<p class="text-muted">
				Administración de técnicos del sistema
			</p>

		</div>

		<div class="card shadow-lg">

			<div class="card-header bg-primary text-white">

				<h4 class="mb-0"
					th:text="${tecnico.idtecnico == null or tecnico.idtecnico == 0} ? '➕ Nuevo Técnico' : '✏️ Editar Técnico'">
				</h4>

			</div>

			<div class="card-body">

				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<form th:action="@{/guardarTecnico}" th:object="${tecnico}" method="post">

					<input type="hidden" th:field="*{idtecnico}">

					<div class="mb-3">

						<label class="form-label fw-semibold">
							👤 Nombre
						</label>

						<input type="text" th:field="*{nombre}" class="form-control"
							placeholder="Ingrese el nombre del técnico" required>

					</div>

					<div class="mb-3">

						<label class="form-label fw-semibold">
							🛠️ Especialidad
						</label>

						<input type="text" th:field="*{especialidad}" class="form-control"
							placeholder="Ingrese la especialidad" required>

					</div>

					<div class="mb-3">

						<label class="form-label fw-semibold">
							📞 Teléfono
						</label>

						<input type="text" th:field="*{telefono}" class="form-control" placeholder="Ingrese el teléfono"
							required>

					</div>

					<div class="d-flex gap-2 mt-4">

						<button type="submit" class="btn btn-primary">
							Guardar
						</button>

						<a th:href="@{/listarTecnicos}" class="btn btn-secondary">
							Regresar
						</a>

					</div>

				</form>

			</div>

			<div class="card-footer text-center text-muted">

				Sistema de Gestión de Técnicos © 2026

			</div>

		</div>

	</div>

</body>

</html>
