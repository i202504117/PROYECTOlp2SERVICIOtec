<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Usuarios</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/admin.css}">

	<style>
		body {
			background: #f4f6f9;
		}

		.titulo {
			color: #0d6efd;
			font-weight: bold;
		}

		.card {
			border: none;
			border-radius: 15px;
		}

		.btn {
			border-radius: 10px;
		}

		.table {
			vertical-align: middle;
		}
	</style>

</head>

<body>

	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<div class="container">

		<div class="text-center mb-4">

			<h1 class="titulo">
				🛡️ Usuarios
			</h1>

			<p class="text-muted">
				Administración de usuarios del sistema
			</p>

		</div>

		<div class="card shadow-lg">

			<div class="card-header bg-primary text-white d-flex justify-content-between">

				<h4 class="mb-0">
					📋 Listado de Usuarios
				</h4>

				<span class="badge bg-light text-dark">
					Total:
					<span th:text="${#lists.size(usuarios)}"></span>
				</span>

			</div>

			<div class="card-body">

				<div class="mb-4">

					<a th:href="@{/nuevoUsuario}" class="btn btn-success">
						➕ Nuevo Usuario
					</a>

					<a th:href="@{/index}" class="btn btn-secondary">
						Regresar
					</a>

				</div>

				<table class="table table-striped table-hover table-bordered">

					<thead class="table-dark">

						<tr>
							<th>Nombre</th>
							<th>Correo</th>
							<th>Rol</th>
						</tr>

					</thead>

					<tbody>

						<tr th:if="${#lists.isEmpty(usuarios)}">
							<td colspan="3" class="text-center text-danger">
								No se encontraron usuarios
							</td>
						</tr>

						<tr th:each="u : ${usuarios}">

							<td th:text="${u.name}"></td>

							<td th:text="${u.email}"></td>

							<td>
								<span class="badge bg-primary" th:text="${u.rol?.nombre}"></span>
							</td>

						</tr>

					</tbody>

				</table>

			</div>

			<div class="card-footer text-center text-muted">

				Sistema de Servicio Técnico © 2026

			</div>

		</div>

	</div>

</body>

</html>
